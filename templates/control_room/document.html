<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{ heading }} · RI BUROM</title><link rel="stylesheet" href="{{ url_for('static',filename='css/control-room.css') }}"><script src="{{ url_for('static',filename='js/control-room.js') }}" defer></script></head><body class="cr-document"><header><img src="{{ url_for('static',filename='control-room/brand.svg') }}" alt=""><h1>{{ settings.footer_business_name }}</h1></header><h2>{{ heading }}</h2><p>Prepared for <strong>{{ customer }}</strong></p><p class="cr-document-description">{{ description }}</p><div class="cr-document-total">Total <strong>₹ {{ '{:,.2f}'.format(amount) }}</strong></div><p>Due / valid until {{ deadline.strftime('%d %B %Y') }}</p><footer>{{ settings.footer_email }} · {{ settings.footer_phone }}<br>{{ settings.footer_address }}</footer><button data-print>Print / Save PDF</button></body></html>
