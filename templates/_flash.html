<link rel="stylesheet" href="{{ url_for('static', filename='css/ri-burom-critical-fix.css') }}?v=1">
<script src="{{ url_for('static', filename='js/ri-burom-critical-fix.js') }}?v=1" defer></script>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, msg in messages %}
      {% if category == 'success' %}
        <div id="rbSuccessModal" class="rb-success-modal" role="dialog" aria-modal="true" aria-labelledby="rbSuccessTitle">
          <div class="rb-success-card">
            <div id="rbSuccessConfetti" class="rb-success-confetti" aria-hidden="true"></div>

            <div class="rb-success-icon" aria-hidden="true">
              <span class="rb-success-check">✓</span>
            </div>

            <p class="rb-success-eyebrow">Enquiry received</p>
            <h2 id="rbSuccessTitle">Thank you!</h2>
            <p class="rb-success-message">{{ msg }}</p>

            <button type="button" id="rbSuccessClose" class="rb-button rb-success-close">
              Continue exploring
            </button>
          </div>
        </div>
      {% else %}
        <div class="max-w-4xl mx-auto px-6 pt-4 space-y-2">
          <div class="p-4 rounded-lg font-semibold text-center bg-red-100 text-red-800 border border-red-300">
            {{ msg }}
          </div>
        </div>
      {% endif %}
    {% endfor %}
  {% endif %}
{% endwith %}
