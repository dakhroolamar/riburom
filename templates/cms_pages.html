{% extends '_cms_shell.html' %}
{% block title %}{{ pages[page] }}{% endblock %}
{% block content %}
<main class="cms-page-workspace" data-cms-page="{{ page }}" data-can-content="{{ 'true' if can_content else 'false' }}" data-can-media="{{ 'true' if can_media else 'false' }}">
  <div class="page-heading-row"><div><p class="eyebrow">Site / Pages</p><h1>{{ pages[page] }}</h1><p class="lede">Choose a section, upload images, then adjust its appearance.</p></div><a class="button secondary" href="{{ preview_url }}" target="_blank" rel="noopener">View page ↗</a></div>
  {% include '_cms_page_workspace.html' %}
</main>
{% endblock %}
