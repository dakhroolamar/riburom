{% extends '_cms_shell.html' %}
{% block content %}<main id="library-page"><div class="page-heading-row"><div><p class="eyebrow">Media</p><h1>Library</h1><p class="lede">Your photographs, ready for every page.</p></div><label class="button">Upload photographs<input id="library-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div class="toolbar library-toolbar"><label>Search<input type="search" id="library-search" placeholder="Filename or title"></label><label>Show<select id="library-filter"><option value="all">All images</option><option value="used">Used images</option><option value="unused">Unused images</option></select></label><button id="library-refresh" type="button">Search</button></div><p id="editor-status" role="status" aria-live="polite"></p><progress id="upload-progress" max="100" value="0" hidden></progress><p id="upload-status" role="status"></p><div id="library-results" class="media-grid"></div></main>{% endblock %}
