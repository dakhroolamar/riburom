<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ri Burom Admin Login</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-green-900 flex items-center justify-center px-6">{% include '_flash.html' %}<div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-8">{% set login_logo = site_settings.hero_logo or site_settings.header_mark or site_settings.header_wordmark %}{% if login_logo %}<img src="{{ login_logo|imgsrc }}" alt="Ri Burom" class="h-20 mx-auto mb-6 object-contain">{% else %}<div class="text-3xl font-bold text-green-800 text-center mb-6">RI BUROM</div>{% endif %}<h1 class="text-2xl font-bold text-amber-900 text-center mb-2">Control Room</h1><p class="text-center text-gray-500 text-sm mb-6">Sign in with your personal RI BUROM account.</p><form method="POST" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="font-bold">Username</label><input type="text" name="username" required maxlength="80" autocomplete="username" class="w-full border p-3 rounded mt-1"></div><div><label class="font-bold">Password</label><input type="password" name="password" required autocomplete="current-password" class="w-full border p-3 rounded mt-1"></div><button class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded">Log In</button></form></div></body></html>
