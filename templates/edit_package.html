<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/ri-burom-compiled.css') }}"><title>Edit {{ pkg.title }} - Ri Burom</title><link rel="stylesheet" href="{{ url_for('static', filename='css/ri-burom-workspace.css') }}">
</head>
<body class="bg-gray-100 p-4 md:p-8 rb-workspace"><div class="max-w-5xl mx-auto"><a href="/admin" class="text-blue-600 hover:underline">← Back to Control Room</a><div class="bg-white p-6 rounded-xl shadow-lg mt-4"><h1 class="text-3xl font-bold text-amber-900 mb-6">Edit Experience</h1><form action="{{ url_for('edit_package', id=pkg.id) }}" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="font-bold">Tour Name</label><input name="title" value="{{ pkg.title }}" required maxlength="200" class="w-full border p-2 rounded"></div><div><label class="font-bold">Location</label><input name="location" value="{{ pkg.location or '' }}" maxlength="200" class="w-full border p-2 rounded"></div><div><label class="font-bold">Duration</label><input name="duration" value="{{ pkg.duration or '' }}" maxlength="100" class="w-full border p-2 rounded"></div><div><label class="font-bold">Starting Price</label><input name="price" value="{{ pkg.price or '' }}" maxlength="100" class="w-full border p-2 rounded"></div><div><label class="font-bold">Category</label><input name="category" value="{{ pkg.category or '' }}" maxlength="100" class="w-full border p-2 rounded"></div><div><label class="font-bold">Difficulty</label><input name="difficulty" value="{{ pkg.difficulty or '' }}" maxlength="50" class="w-full border p-2 rounded"></div><div class="md:col-span-2"><label class="font-bold">Best Season</label><input name="best_season" value="{{ pkg.best_season or '' }}" maxlength="200" class="w-full border p-2 rounded"></div><div class="md:col-span-2"><label class="font-bold">Overview / Description</label><textarea name="description" rows="6" required maxlength="10000" class="w-full border p-2 rounded">{{ pkg.description }}</textarea></div><div class="md:col-span-2"><label class="font-bold">Itinerary</label><textarea name="itinerary" rows="8" class="w-full border p-2 rounded">{{ pkg.itinerary or '' }}</textarea></div><div><label class="font-bold">What's Included</label><textarea name="included" rows="6" class="w-full border p-2 rounded">{{ pkg.included or '' }}</textarea></div><div><label class="font-bold">What's Excluded</label><textarea name="excluded" rows="6" class="w-full border p-2 rounded">{{ pkg.excluded or '' }}</textarea></div><div><label class="font-bold">Replace Photo</label><input type="file" name="photo" accept="image/*" class="w-full border p-2 rounded">{% if pkg.image_file %}<label class="block mt-2"><input type="checkbox" name="remove_image" class="mr-2">Remove current photo</label>{% endif %}</div><div><label class="font-bold">Replace PDF</label><input type="file" name="pdf" accept="application/pdf,.pdf" class="w-full border p-2 rounded">{% if pkg.pdf_file %}<label class="block mt-2"><input type="checkbox" name="remove_pdf" class="mr-2">Remove current PDF</label>{% endif %}</div><div><label class="font-bold">Sort Order</label><input type="number" name="sort_order" value="{{ pkg.sort_order }}" class="w-full border p-2 rounded"></div><div class="flex items-center gap-6 pt-7"><label><input type="checkbox" name="published" {% if pkg.published %}checked{% endif %} class="mr-2">Published</label><label><input type="checkbox" name="featured" {% if pkg.featured %}checked{% endif %} class="mr-2">Featured</label></div><button class="md:col-span-2 bg-green-700 text-white font-bold py-3 rounded">Save Changes</button></form></div></div></body></html>
