{% extends 'control_room/base.html' %}
{% set section='settings' %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/ri-burom-compiled.css') }}">
<style></style>{% endblock %}
{% block content %}<div class="cr-legacy"><div class="max-w-2xl mx-auto"><a href="/admin" class="text-blue-600 hover:underline font-semibold">← Control Room</a><div class="bg-white p-8 rounded-xl shadow-lg mt-4"><h1 class="text-3xl font-bold text-amber-900">My Account</h1><p class="text-gray-600 mt-2">{{ user.full_name }} · {{ user.role_label }}</p><form method="POST" class="space-y-4 mt-8"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="font-bold">Current Password</label><input type="password" name="current_password" required autocomplete="current-password" class="w-full border p-3 rounded mt-1"></div><div><label class="font-bold">New Password</label><input type="password" name="new_password" minlength="12" required autocomplete="new-password" class="w-full border p-3 rounded mt-1"></div><div><label class="font-bold">Confirm New Password</label><input type="password" name="confirm_password" minlength="12" required autocomplete="new-password" class="w-full border p-3 rounded mt-1"></div><button class="w-full bg-green-700 text-white font-bold py-3 rounded">Change Password</button></form></div></div></div>{% endblock %}
