{% extends 'control_room/base.html' %}
{% set section='website' %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/ri-burom-compiled.css') }}">
<style></style>{% endblock %}
{% block content %}<div class="cr-legacy"><div class="max-w-3xl mx-auto"><a href="/admin" class="text-blue-600 hover:underline">← Back to Control Room</a><div class="bg-white p-6 rounded-xl shadow-lg mt-4"><h1 class="text-3xl font-bold text-amber-900 mb-6">Edit Team Member</h1><form action="{{ url_for('edit_team_member', id=member.id) }}" method="POST" enctype="multipart/form-data" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="font-bold">Name</label><input name="name" value="{{ member.name }}" required maxlength="200" class="w-full border p-2 rounded"></div><div><label class="font-bold">Position / Display Title</label><input name="position" value="{{ member.position }}" required maxlength="200" class="w-full border p-2 rounded"></div><div><label class="font-bold">Profile Role</label><select name="role_type" class="w-full border p-2 rounded"><option value="founder" {% if member.role_type == "founder" %}selected{% endif %}>Founder</option><option value="co_founder" {% if member.role_type == "co_founder" %}selected{% endif %}>Co-Founder</option><option value="designer" {% if member.role_type == "designer" %}selected{% endif %}>Designer</option><option value="team_member" {% if member.role_type == "team_member" %}selected{% endif %}>Team Member</option><option value="custom" {% if member.role_type == "custom" %}selected{% endif %}>Custom</option></select></div><div><label class="font-bold">Short Bio</label><textarea name="description" rows="6" class="w-full border p-2 rounded">{{ member.description or '' }}</textarea></div><div><label class="font-bold">Replace Photo</label><input type="file" name="photo" accept="image/*" class="w-full border p-2 rounded">{% if member.photo_file %}<label class="block mt-2"><input type="checkbox" name="remove_photo" class="mr-2">Remove current photo</label>{% endif %}</div><button class="w-full bg-purple-800 text-white font-bold py-3 rounded">Save Changes</button></form></div></div></div>{% endblock %}
