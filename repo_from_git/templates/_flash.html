{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="max-w-4xl mx-auto px-6 pt-4 space-y-2">
      {% for category, msg in messages %}
        <div class="p-4 rounded-lg font-semibold text-center {{ 'bg-green-100 text-green-800 border border-green-300' if category == 'success' else 'bg-red-100 text-red-800 border border-red-300' }}">
          {{ msg }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
