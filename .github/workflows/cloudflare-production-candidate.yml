name: Cloudflare production candidate

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - 'app.py'
      - 'deploy/cloudflare/**'
      - '.github/workflows/cloudflare-production-candidate.yml'
      - 'tests/test_cloudflare_candidate.py'
      - 'tests/test_cloudflare_outbox_handoff.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-candidate
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the preview boundaries and assemble the candidate
        # The dry run never has credentials or a live database binding.
        env:
          RIBUROM_PRODUCTION_HYPERDRIVE_ID: '00000000000000000000000000000001'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python -m unittest tests.test_cloudflare_candidate tests.test_cloudflare_outbox_handoff
          python deploy/cloudflare/build.py --production-candidate
          cd deploy/cloudflare/build
          python -m pip install uv==0.13.9
          npm install --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --python "$(cat ../../../.python-version)"
          uv run --no-sync pywrangler deploy --dry-run

      - name: Verify the public bundle without publishing routes
        if: contains(github.event.head_commit.message, '[verify live bundle]') || contains(github.event.head_commit.message, '[production live]')
        env:
          RIBUROM_PRODUCTION_HYPERDRIVE_ID: '00000000000000000000000000000001'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python -m pip install uv==0.13.9
          python deploy/cloudflare/build.py --production-live --enable-live-outbox --output "$RUNNER_TEMP/riburom-live-package"
          cd "$RUNNER_TEMP/riburom-live-package"
          npm install --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --python "$(cat "$GITHUB_WORKSPACE/.python-version")"
          uv run --no-sync pywrangler deploy --dry-run

  deploy:
    needs: package
    # Legacy preview markers must not replace the currently live Worker.
    if: github.ref == 'refs/heads/codex/cloudflare-free-hosting' && vars.CLOUDFLARE_PRODUCTION_CANDIDATE_ENABLED == 'true' && (contains(github.event.head_commit.message, '[production live]') || (vars.CLOUDFLARE_ALLOW_PRODUCTION_REHEARSAL == 'true' && (contains(github.event.head_commit.message, '[production candidate]') || contains(github.event.head_commit.message, '[prepare production website]'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-production-candidate
    outputs:
      candidate_ready: ${{ steps.verify.outputs.candidate_ready }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      CANDIDATE: https://riburom-production.dakhroo.workers.dev
      LIVE_SCHEDULED: ${{ contains(github.event.head_commit.message, '[production live]') && 'true' || 'false' }}
      PREPARE_LIVE: ${{ (contains(github.event.head_commit.message, '[prepare production website]') || contains(github.event.head_commit.message, '[production live]')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build against the dedicated production binding
        env:
          RIBUROM_PRODUCTION_HYPERDRIVE_ID: ${{ vars.RIBUROM_PRODUCTION_HYPERDRIVE_ID }}
        run: |
          if [ "$LIVE_SCHEDULED" = true ]; then
            python deploy/cloudflare/build.py --production-live --enable-live-outbox
          elif [ "$PREPARE_LIVE" = true ]; then
            python deploy/cloudflare/build.py --production-live
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("deploy/cloudflare/build/wrangler.jsonc")
          config = json.loads(path.read_text(encoding="utf-8"))
          assert config["workers_dev"] is False and config["preview_urls"] is False
          assert config["triggers"]["crons"] == []
          assert config["vars"]["OUTBOX_SCHEDULED"] == "false"
          assert config["vars"]["RIBUROM_LIVE_OUTBOX_APPROVED"] == "false"
          # Domains are attached and verified separately during the change window.
          del config["routes"]
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          else
            python deploy/cloudflare/build.py --production-candidate
          fi
          cd deploy/cloudflare/build
          python -m pip install uv==0.13.9
          npm install --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --python "$(cat ../../../.python-version)"
      - name: Verify candidate preview secrets are configured
        env:
          ACCESS: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
          SESSION: ${{ secrets.RIBUROM_CANDIDATE_SESSION_SECRET }}
          ADMIN_HASH: ${{ secrets.RIBUROM_CANDIDATE_ADMIN_HASH }}
          MEDIA: ${{ secrets.RIBUROM_PRODUCTION_CLOUDINARY_URL }}
        run: |
          test -n "$ACCESS" || { echo "::error::Missing candidate preview password"; exit 1; }
          test -n "$SESSION" || { echo "::error::Missing candidate session secret"; exit 1; }
          test -n "$ADMIN_HASH" || { echo "::error::Missing candidate admin hash"; exit 1; }
          test -n "$MEDIA" || { echo "::error::Missing production Cloudinary credential"; exit 1; }
          case "$MEDIA" in
            cloudinary://*@*) ;;
            *) echo "::error::Production Cloudinary credential must be a CLOUDINARY_URL"; exit 1 ;;
          esac
          test "${#ACCESS}" -ge 24 || { echo "::error::Candidate access password too short"; exit 1; }
          test "${#SESSION}" -ge 32 || { echo "::error::Candidate session secret too short"; exit 1; }
          case "$ADMIN_HASH" in
            scrypt:*|pbkdf2:*) ;;
            *) echo "::error::Candidate admin hash must be a valid Werkzeug hash"; exit 1 ;;
          esac

      - name: Authorize the one-off production Brevo probe
        if: env.PREPARE_LIVE == 'false' && contains(github.event.head_commit.message, '[production brevo check]')
        run: |
          python - <<'PY'
          import os
          from secrets import token_urlsafe
          from time import time

          token = token_urlsafe(32)
          authorization = f"{token}:{int(time()) + 1200}"
          print(f"::add-mask::{token}", flush=True)
          print(f"::add-mask::{authorization}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PRODUCTION_BREVO_PROBE_TOKEN={token}\nPRODUCTION_BREVO_PROBE_AUTH={authorization}\n")
          PY

      - name: Deploy Worker with its required secrets
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          ACCESS: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
          SESSION: ${{ secrets.RIBUROM_CANDIDATE_SESSION_SECRET }}
          ADMIN_HASH: ${{ secrets.RIBUROM_CANDIDATE_ADMIN_HASH }}
          MEDIA: ${{ secrets.RIBUROM_PRODUCTION_CLOUDINARY_URL }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          umask 077
          secrets_file="$(mktemp --suffix=.json "$RUNNER_TEMP/riburom-candidate-secrets.XXXXXX")"
          trap 'rm -f -- "$secrets_file"' EXIT
          python - "$secrets_file" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          try:
              media = urlsplit(os.environ["MEDIA"])
              valid = media.scheme == "cloudinary" and media.username and media.password and media.hostname
          except ValueError:
              valid = False
          if not valid:
              sys.exit("Production Cloudinary URL must contain an API key, API secret and cloud name")
          names = {"ACCESS": "RIBUROM_STAGING_ACCESS_TOKEN", "SESSION": "SECRET_KEY",
                   "ADMIN_HASH": "ADMIN_PASSWORD_HASH", "MEDIA": "CLOUDINARY_URL"}
          if os.environ.get("PRODUCTION_BREVO_PROBE_AUTH"):
              names["PRODUCTION_BREVO_PROBE_AUTH"] = "RIBUROM_BREVO_PROBE_AUTH"
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump({binding: os.environ[key] for key, binding in names.items()}, output)
          PY
          uv run --no-sync pywrangler deploy --secrets-file "$secrets_file"
      - name: Verify live domain readiness and canonical redirect
        if: env.LIVE_SCHEDULED == 'true'
        run: |
          for endpoint in healthz readyz; do
            curl --silent --show-error --fail --max-time 60 --retry 3 --retry-all-errors --retry-delay 3 "https://riburomtours.com/$endpoint" \
              | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == sys.argv[1]' "$(if [ "$endpoint" = healthz ]; then echo ok; else echo ready; fi)"
          done
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://www.riburomtours.com/)" = 301
          curl -sS --fail --max-time 60 -o /dev/null https://riburomtours.com/sitemap.xml
      - name: Verify access, runtime database checks and SEO
        if: env.PREPARE_LIVE == 'false'
        id: verify
        env:
          SEO_PREVIEW_PASSWORD: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
        run: |
          test -n "$SEO_PREVIEW_PASSWORD"
          for path in /healthz /readyz /static/control-room/ri-burom-mark.png; do
            test "$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "$CANDIDATE$path")" = 401
          done
          status="$(curl --silent --show-error --max-time 60 \
            --dump-header "$RUNNER_TEMP/candidate-ready-headers" \
            --output "$RUNNER_TEMP/candidate-ready-body" \
            --write-out '%{http_code}' \
            -u "rehearsal:$SEO_PREVIEW_PASSWORD" "$CANDIDATE/readyz")"
          echo "Authenticated candidate readiness HTTP $status"
          # Print only the MIME type; never print production page content or credentials.
          grep -i '^content-type:' "$RUNNER_TEMP/candidate-ready-headers" || true
          if [ "$status" != 200 ]; then
            # The protected candidate emits a schema-limited sanitized JSON
            # classification. Never log arbitrary response bodies or SQL.
            if grep -qi '^content-type: application/json' "$RUNNER_TEMP/candidate-ready-headers"; then
              python - "$RUNNER_TEMP/candidate-ready-body" <<'PY'
          import json
          import sys
          try:
              payload = json.load(open(sys.argv[1]))
              if payload.get("status") in {"candidate_startup_failed", "candidate_wsgi_failed"}:
                  category = payload.get("exception", "unknown")
                  print("Candidate runtime category:", payload["status"], str(category)[:80])
                  permitted = {"role_ok", "database_ok", "schema_ok", "writable_ok",
                               "revision_ok", "enquiry_grant_ok", "tour_grant_ok", "restricted_role_ok"}
                  failures = payload.get("failed_checks", [])
                  if isinstance(failures, list) and all(item in permitted for item in failures):
                      if failures:
                          print("Failed candidate guard checks:", ", ".join(failures))
                  if payload.get("reason") in ("session_secret_missing", "admin_hash_missing",
                                               "cloudinary_binding_missing", "cloudinary_config_missing"):
                      print("Candidate configuration hint:", payload["reason"])
                  trace = payload.get("source_trace", [])
                  if isinstance(trace, list):
                      import re
                      valid = r"(?:worker|worker_runtime|app|wsgi|application_modules|models|notifications|control_room|storage)\.py:[0-9]{1,5}"
                      if all(isinstance(loc, str) and re.fullmatch(valid, loc) for loc in trace):
                          if trace:
                              print("Candidate startup source locations:", ", ".join(trace))
          except (OSError, ValueError):
              pass
          PY
            fi
            echo "::error::Protected candidate readiness not successful (HTTP $status)"
            exit 1
          fi
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ready"' "$RUNNER_TEMP/candidate-ready-body"
          curl --silent --show-error --fail --max-time 30 \
            -u "rehearsal:$SEO_PREVIEW_PASSWORD" "$CANDIDATE/healthz" \
            | python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ok"'
          python -m pip install requests beautifulsoup4
          python tests/cloudflare_seo_acceptance.py --candidate production
          curl --silent --show-error --fail --max-time 30 \
            -u "rehearsal:$SEO_PREVIEW_PASSWORD" "$CANDIDATE/readyz" \
            | python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ready"; print("Candidate remained ready after SEO checks")'
          echo "candidate_ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify production Brevo OAuth and submit one synthetic message
        if: env.PREPARE_LIVE == 'false' && contains(github.event.head_commit.message, '[production brevo check]')
        env:
          PREVIEW_PASSWORD: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
        run: |
          url="$CANDIDATE/__candidate/brevo-delivery"
          test "$(curl -sS --max-time 20 -X POST -o /dev/null -w '%{http_code}' "$url")" = 401
          test "$(curl -sS --max-time 20 -X POST -o /dev/null -w '%{http_code}' -u "rehearsal:$PREVIEW_PASSWORD" "$url")" = 404
          umask 077
          response="$(mktemp "$RUNNER_TEMP/brevo-probe-response.XXXXXX")"
          trap 'rm -f -- "$response"' EXIT
          status="$(curl -sS --max-time 35 -X POST -o "$response" -w '%{http_code}' \
            -u "rehearsal:$PREVIEW_PASSWORD" -H "X-Riburom-Brevo-Probe: $PRODUCTION_BREVO_PROBE_TOKEN" "$url")"
          python - "$response" "$status" <<'PY'
          import json
          import sys

          known = {"accepted", "already_accepted", "oauth_rejected", "delivery_not_accepted",
                   "delivery_outcome_unknown", "production_oauth_configuration_incomplete", "oauth_transport_error",
                   "previous_attempt_needs_reconciliation", "probe_not_enabled",
                   "probe_binding_missing_or_invalid", "probe_token_expired", "probe_token_mismatch"}
          oauth_errors = {"invalid_client", "invalid_grant", "invalid_request", "invalid_scope",
                          "unauthorized_client", "access_denied", "unsupported_grant_type",
                          "temporarily_unavailable", "unauthorized", "forbidden"}
          stage = "entrypoint"
          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
              result = payload.get("status")
              if payload.get("stage") == "durable_object":
                  stage = "durable_object"
          except (OSError, ValueError, AttributeError):
              result = None
          print("Production Brevo probe HTTP", sys.argv[2], result if result in known else "unclassified", stage)
          if result == "oauth_rejected":
              status = payload.get("provider_http_status")
              reason = payload.get("oauth_error")
              print("Brevo token endpoint", status if type(status) is int and 100 <= status <= 599 else "unknown",
                    reason if reason in oauth_errors else "unclassified")
          if sys.argv[2] != "200" or result not in {"accepted", "already_accepted"}:
              sys.exit(1)
          PY

  idle-recovery:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.candidate_ready == 'true' && contains(github.event.head_commit.message, '[idle acceptance]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: cloudflare-production-candidate
    env:
      CANDIDATE: https://riburom-production.dakhroo.workers.dev
      PREVIEW_PASSWORD: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
    steps:
      - name: Observe candidate readiness before and after six minutes without probe traffic
        run: |
          check_readiness() {
            umask 077
            payload="$(mktemp "$RUNNER_TEMP/idle-readiness.XXXXXX")"
            curl -sS --fail --max-time 60 -u "rehearsal:$PREVIEW_PASSWORD" -o "$payload" \
              -w "$1 readiness: HTTP %{http_code}, TTFB %{time_starttransfer}s, total %{time_total}s\n" "$CANDIDATE/readyz"
            python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ready"' "$payload"
            rm -f -- "$payload"
          }
          check_readiness Before
          sleep 360
          check_readiness After
          check_readiness Warm
