name: Cloudflare production candidate

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - 'deploy/cloudflare/**'
      - '.github/workflows/cloudflare-production-candidate.yml'
      - 'tests/test_cloudflare_candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-candidate
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the preview boundaries and assemble the candidate
        # The dry run never has credentials or a live database binding.
        env:
          RIBUROM_PRODUCTION_HYPERDRIVE_ID: '00000000000000000000000000000001'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python -m unittest tests.test_cloudflare_candidate tests.test_cloudflare_outbox_handoff
          python deploy/cloudflare/build.py --production-candidate
          cd deploy/cloudflare/build
          python -m pip install uv==0.13.9
          npm install --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --python "$(cat ../../../.python-version)"
          uv run --no-sync pywrangler deploy --dry-run

  deploy:
    needs: package
    if: github.ref == 'refs/heads/codex/cloudflare-free-hosting' && contains(github.event.head_commit.message, '[production candidate]') && vars.CLOUDFLARE_PRODUCTION_CANDIDATE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-production-candidate
    env:
      WRANGLER_SEND_METRICS: 'false'
      CANDIDATE: https://riburom-production.dakhroo.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build against the dedicated production binding
        env:
          RIBUROM_PRODUCTION_HYPERDRIVE_ID: ${{ vars.RIBUROM_PRODUCTION_HYPERDRIVE_ID }}
          RIBUROM_PARALLEL_HYPERDRIVE_ID: ${{ vars.RIBUROM_PARALLEL_HYPERDRIVE_ID }}
          RIBUROM_STAGING_HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: |
          test -n "$RIBUROM_PARALLEL_HYPERDRIVE_ID"
          test -n "$RIBUROM_STAGING_HYPERDRIVE_ID"
          python deploy/cloudflare/build.py --production-candidate
          cd deploy/cloudflare/build
          python -m pip install uv==0.13.9
          npm install --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --python "$(cat ../../../.python-version)"
      - name: Verify candidate preview secrets are configured
        env:
          ACCESS: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
          SESSION: ${{ secrets.RIBUROM_CANDIDATE_SESSION_SECRET }}
          ADMIN_HASH: ${{ secrets.RIBUROM_CANDIDATE_ADMIN_HASH }}
        run: |
          test -n "$ACCESS" || { echo "::error::Missing candidate preview password"; exit 1; }
          test -n "$SESSION" || { echo "::error::Missing candidate session secret"; exit 1; }
          test -n "$ADMIN_HASH" || { echo "::error::Missing candidate admin hash"; exit 1; }
          test "${#ACCESS}" -ge 24 || { echo "::error::Candidate access password too short"; exit 1; }
          test "${#SESSION}" -ge 32 || { echo "::error::Candidate session secret too short"; exit 1; }
          case "$ADMIN_HASH" in
            scrypt:*|pbkdf2:*) ;;
            *) echo "::error::Candidate admin hash must be a valid Werkzeug hash"; exit 1 ;;
          esac

      - name: Deploy protected Worker
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          uv run --no-sync pywrangler deploy

      - name: Install dedicated candidate secrets before allowing any authenticated checks
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          ACCESS: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
          SESSION: ${{ secrets.RIBUROM_CANDIDATE_SESSION_SECRET }}
          ADMIN_HASH: ${{ secrets.RIBUROM_CANDIDATE_ADMIN_HASH }}
        run: |
          # All values stay in masked workflow secrets and are piped to Wrangler,
          # not interpolated into shell arguments or printed to logs.
          printf '%s' "$ACCESS" | ./node_modules/.bin/wrangler secret put RIBUROM_STAGING_ACCESS_TOKEN --name riburom-production
          printf '%s' "$SESSION" | ./node_modules/.bin/wrangler secret put SECRET_KEY --name riburom-production
          printf '%s' "$ADMIN_HASH" | ./node_modules/.bin/wrangler secret put ADMIN_PASSWORD_HASH --name riburom-production
      - name: Verify access, runtime database checks and SEO
        env:
          SEO_PREVIEW_PASSWORD: ${{ secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN }}
        run: |
          test -n "$SEO_PREVIEW_PASSWORD"
          for path in /readyz /static/control-room/ri-burom-mark.png; do
            test "$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "$CANDIDATE$path")" = 401
          done
          status="$(curl --silent --show-error --max-time 60 \
            --dump-header "$RUNNER_TEMP/candidate-ready-headers" \
            --output "$RUNNER_TEMP/candidate-ready-body" \
            --write-out '%{http_code}' \
            -u "rehearsal:$SEO_PREVIEW_PASSWORD" "$CANDIDATE/readyz")"
          echo "Authenticated candidate readiness HTTP $status"
          # Print only the MIME type; never print production page content or credentials.
          grep -i '^content-type:' "$RUNNER_TEMP/candidate-ready-headers" || true
          if [ "$status" != 200 ]; then
            # The protected candidate emits a schema-limited sanitized JSON
            # classification. Never log arbitrary response bodies or SQL.
            if grep -qi '^content-type: application/json' "$RUNNER_TEMP/candidate-ready-headers"; then
              python - "$RUNNER_TEMP/candidate-ready-body" <<'PY'
import json
import sys
try:
    payload = json.load(open(sys.argv[1]))
    if payload.get("status") in {"candidate_startup_failed", "candidate_wsgi_failed"}:
        category = payload.get("exception", "unknown")
        print("Candidate runtime category:", payload["status"], str(category)[:80])
except (OSError, ValueError):
    pass
PY
            fi
            echo "::error::Protected candidate readiness not successful (HTTP $status)"
            exit 1
          fi
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ready"' "$RUNNER_TEMP/candidate-ready-body"
          python -m pip install requests beautifulsoup4
          python tests/cloudflare_seo_acceptance.py --candidate production
