name: Cloudflare application staging

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - '.github/workflows/cloudflare-application-staging.yml'
      - '*.py'
      - 'deploy/cloudflare/**'
      - 'static/**'
      - 'templates/**'
      - 'tests/cloudflare_business_acceptance.py'

permissions:
  contents: read

concurrency:
  group: cloudflare-application-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_APPLICATION_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: cloudflare-application-staging
    env:
      WRANGLER_SEND_METRICS: 'false'
      STAGING_URL: https://riburom-application-staging.dakhroo.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Assemble the protected application Worker
        env:
          RIBUROM_STAGING_HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: |
          python deploy/cloudflare/build.py --application-staging --enable-staging-url
          python -m pip install uv==0.13.9
          npm install --prefix deploy/cloudflare/build --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --directory deploy/cloudflare/build --python "$(cat .python-version)"

      - name: Record prior staging resource usage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: python deploy/cloudflare/staging_usage.py

      - name: Deploy using the application staging token
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          uv run --no-sync pywrangler deploy

      - name: Install staging access password when provided by GitHub
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          if [ -n "$STAGING_ACCESS_PASSWORD" ]; then
            printf '%s' "$STAGING_ACCESS_PASSWORD" |
              ./node_modules/.bin/wrangler secret put RIBUROM_STAGING_ACCESS_TOKEN --name riburom-application-staging
          else
            echo "No GitHub staging password provided; checking for a previously configured Cloudflare secret."
          fi

      - name: Check that anonymous requests are denied
        run: |
          for path in /healthz /static/control-room/ri-burom-mark.png; do
            status=$(curl --silent --show-error --max-time 20 --retry 4 --output /dev/null \
              --write-out '%{http_code}' "$STAGING_URL$path")
            if [ "$status" != 401 ]; then
              printf 'Expected 401 for %s, got %s\n' "$path" "$status"
              if [ "$status" = 404 ]; then
                echo "::error::Check that RIBUROM_STAGING_ACCESS_TOKEN exists on the application staging Worker. Set it in Cloudflare, or set the same named GitHub environment secret for automatic provisioning."
              fi
              exit 1
            fi
          done

      - name: Verify authenticated application readiness when possible
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          if [ -z "$STAGING_ACCESS_PASSWORD" ]; then
            echo "Authenticated check skipped: staging password is stored only in Cloudflare."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 30 --retry 3 \
            --dump-header "$RUNNER_TEMP/ready-headers" --output "$RUNNER_TEMP/riburom-readyz.txt" \
            --write-out '%{http_code} %{time_total}' --retry-all-errors --retry-delay 1 --user "rehearsal:$STAGING_ACCESS_PASSWORD" "$STAGING_URL/readyz")
          printf 'First authenticated readiness probe (HTTP, seconds): %s\n' "$status"
          grep -i '^x-riburom-staging-first-request:' "$RUNNER_TEMP/ready-headers" || true
          if [ "${status%% *}" != 200 ]; then
            printf 'Authenticated /readyz expected 200, got %s\n' "$status"
            exit 1
          fi

      - name: Initialize isolated staging Owner and demonstration tours
        if: ${{ !cancelled() }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          test -n "$STAGING_ACCESS_PASSWORD"
          status=$(curl --silent --show-error --max-time 30 --retry 2 \
            --user "rehearsal:$STAGING_ACCESS_PASSWORD" --request POST \
            --output "$RUNNER_TEMP/riburom-staging-init.json" \
            --write-out '%{http_code}' "$STAGING_URL/__staging/bootstrap")
          if [ "$status" != 200 ]; then
            printf 'Staging-only bootstrap failed: HTTP %s\n' "$status"
            cat "$RUNNER_TEMP/riburom-staging-init.json"
            exit 1
          fi
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["status"] in ("initialized","already_initialized"), data; print("Staging data:", data["status"])' \
            "$RUNNER_TEMP/riburom-staging-init.json"

      - name: Smoke-test protected public pages and static media
        if: ${{ !cancelled() }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          if [ -z "$STAGING_ACCESS_PASSWORD" ]; then
            echo "::error::The GitHub staging password is required for authenticated page smoke tests."
            exit 1
          fi
          for path in / /all_tours /about /marketplace /stories; do
            status=$(curl --silent --show-error --max-time 30 --retry 2 \
              --output "$RUNNER_TEMP/riburom-smoke.html" \
              --write-out '%{http_code}' --user "rehearsal:$STAGING_ACCESS_PASSWORD" "$STAGING_URL$path")
            printf '%s: HTTP %s\n' "$path" "$status"
            if [ "$status" != 200 ]; then
              echo "::error::Staging page $path failed with HTTP $status."
              exit 1
            fi
            python -c 'import pathlib,sys; body=pathlib.Path(sys.argv[1]).read_text(errors="replace").lower(); assert "<html" in body, "Expected rendered HTML"' \
              "$RUNNER_TEMP/riburom-smoke.html"
            if [ "$path" = "/all_tours" ]; then
              python -c 'import pathlib,sys; page=pathlib.Path(sys.argv[1]).read_text(errors="replace").lower(); names=("adventure","true colours of the jaintia","family tour plan","7 nights 8 days"); missing=[n for n in names if n not in page]; assert not missing, "Missing published staging tours: "+", ".join(missing)' \
                "$RUNNER_TEMP/riburom-smoke.html"
            fi
          done
          status=$(curl --silent --show-error --max-time 20 --retry 2 \
            --output "$RUNNER_TEMP/riburom-mark.png" \
            --write-out '%{http_code}' --user "rehearsal:$STAGING_ACCESS_PASSWORD" \
            "$STAGING_URL/static/control-room/ri-burom-mark.png")
          printf '%s: HTTP %s\n' "/static/control-room/ri-burom-mark.png" "$status"
          if [ "$status" != 200 ] || [ ! -s "$RUNNER_TEMP/riburom-mark.png" ]; then
            echo "::error::Staging static brand asset failed."
            exit 1
          fi
          python -c 'import pathlib,sys; data=pathlib.Path(sys.argv[1]).read_bytes(); assert data.startswith(bytes((137,80,78,71,13,10,26,10))), "Brand image response is not a valid PNG"' \
            "$RUNNER_TEMP/riburom-mark.png"
          status=$(curl --silent --show-error --max-time 20 --retry 2 \
            --output "$RUNNER_TEMP/riburom-control.css" \
            --write-out '%{http_code}' --user "rehearsal:$STAGING_ACCESS_PASSWORD" \
            "$STAGING_URL/static/css/control-room.css")
          printf '%s: HTTP %s\n' "/static/css/control-room.css" "$status"
          if [ "$status" != 200 ] || [ ! -s "$RUNNER_TEMP/riburom-control.css" ]; then
            echo "::error::Staging Control Room stylesheet failed."
            exit 1
          fi

      - name: Verify anonymous public cache and uncached homepage
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          test -n "$STAGING_ACCESS_PASSWORD"
          hits=0
          for attempt in 1 2 3 4; do
            status=$(curl --silent --show-error --max-time 25 --retry 2 \
              --user "rehearsal:$STAGING_ACCESS_PASSWORD" \
              --dump-header "$RUNNER_TEMP/riburom-cache-header" \
              --output "$RUNNER_TEMP/riburom-cache-body" \
              --write-out '%{http_code}' "$STAGING_URL/all_tours")
            test "$status" = 200
            if grep -qi '^x-riburom-cache: HIT' "$RUNNER_TEMP/riburom-cache-header"; then
              hits=$((hits+1))
              grep -qi '^cache-control:.*no-store' "$RUNNER_TEMP/riburom-cache-header"
              if grep -qi '^x-riburom-staging-sql-count:' "$RUNNER_TEMP/riburom-cache-header"; then exit 1; fi
            fi
          done
          printf 'Public tours cache hits: %s/4\n' "$hits"
          if [ "$hits" -lt 1 ]; then
            echo "::error::No cache hits from four same-runner requests; cache optimization not verified."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 25 --retry 2 \
            --user "rehearsal:$STAGING_ACCESS_PASSWORD" \
            --dump-header "$RUNNER_TEMP/riburom-home-header" \
            --output "$RUNNER_TEMP/riburom-home-body" \
            --write-out '%{http_code}' "$STAGING_URL/")
          test "$status" = 200
          if grep -qi '^x-riburom-cache: HIT' "$RUNNER_TEMP/riburom-home-header"; then exit 1; fi
          status=$(curl --silent --show-error --max-time 25 --cookie 'ri_cache_check=1' \
            --user "rehearsal:$STAGING_ACCESS_PASSWORD" --dump-header "$RUNNER_TEMP/riburom-cookie-header" \
            --output /dev/null --write-out '%{http_code}' "$STAGING_URL/all_tours")
          test "$status" = 200
          if grep -qi '^x-riburom-cache: HIT' "$RUNNER_TEMP/riburom-cookie-header"; then exit 1; fi
          grep -qi '^x-riburom-staging-sql-count: [1-9]' "$RUNNER_TEMP/riburom-cookie-header"
          echo "Homepage CSRF form is never served from the public page cache."

      - name: Verify staging Control Room login and session
        if: ${{ !cancelled() }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          python deploy/cloudflare/staging_login_smoke.py

      - name: Profile public routes and staging SQL time
        if: ${{ !cancelled() }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: python deploy/cloudflare/profile_hosts.py

      - name: Upload baseline performance profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riburom-performance-profile
          path: ${{ runner.temp }}/riburom-profile.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Compare public Render and Cloudflare response times (read only)
        if: ${{ always() && vars.RIBUROM_BENCHMARK_ENABLED == 'true' }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          python deploy/cloudflare/compare_hosts.py

      - name: Save latency comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riburom-host-comparison
          path: ${{ runner.temp }}/riburom-host-comparison.json
          if-no-files-found: ignore
          retention-days: 7

  business-acceptance:
    needs: deploy
    if: ${{ success() && contains(github.event.head_commit.message, '[staging acceptance]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-application-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install requests beautifulsoup4 Pillow==12.3.0
      - name: Exercise isolated staging business workflows
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: python tests/cloudflare_business_acceptance.py
      - name: Compare sitemap, canonical URLs, metadata and Google verification
        if: ${{ !cancelled() }}
        env:
          SEO_PREVIEW_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: python tests/cloudflare_seo_acceptance.py --candidate staging

  brevo-acceptance:
    needs: deploy
    # Opt-in only. Never activate scheduler or send production/customer email.
    if: ${{ success() && contains(github.event.head_commit.message, '[staging brevo send]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-application-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install requests
      - name: Verify Brevo OAuth and send one synthetic staging-only notification
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: python tests/cloudflare_brevo_acceptance.py
