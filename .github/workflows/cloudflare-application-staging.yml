name: Cloudflare application staging

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - '.github/workflows/cloudflare-application-staging.yml'
      - '*.py'
      - 'deploy/cloudflare/**'
      - 'static/**'
      - 'templates/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-application-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_APPLICATION_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: cloudflare-application-staging
    env:
      WRANGLER_SEND_METRICS: 'false'
      STAGING_URL: https://riburom-application-staging.dakhroo.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Assemble the protected application Worker
        env:
          RIBUROM_STAGING_HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: |
          python deploy/cloudflare/build.py --application-staging --enable-staging-url
          python -m pip install uv==0.13.9
          npm install --prefix deploy/cloudflare/build --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --directory deploy/cloudflare/build --python "$(cat .python-version)"

      - name: Deploy using the application staging token
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          uv run --no-sync pywrangler deploy

      - name: Install staging access password when provided by GitHub
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          if [ -n "$STAGING_ACCESS_PASSWORD" ]; then
            printf '%s' "$STAGING_ACCESS_PASSWORD" |
              ./node_modules/.bin/wrangler secret put RIBUROM_STAGING_ACCESS_TOKEN --name riburom-application-staging
          else
            echo "No GitHub staging password provided; checking for a previously configured Cloudflare secret."
          fi

      - name: Check that anonymous requests are denied
        run: |
          for path in /healthz /static/control-room/ri-burom-mark.png; do
            status=$(curl --silent --show-error --max-time 20 --retry 4 --output /dev/null \
              --write-out '%{http_code}' "$STAGING_URL$path")
            if [ "$status" != 401 ]; then
              printf 'Expected 401 for %s, got %s\n' "$path" "$status"
              if [ "$status" = 404 ]; then
                echo "::error::Check that RIBUROM_STAGING_ACCESS_TOKEN exists on the application staging Worker. Set it in Cloudflare, or set the same named GitHub environment secret for automatic provisioning."
              fi
              exit 1
            fi
          done

      - name: Verify authenticated application readiness when possible
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.RIBUROM_STAGING_ACCESS_TOKEN }}
        run: |
          if [ -z "$STAGING_ACCESS_PASSWORD" ]; then
            echo "Authenticated check skipped: staging password is stored only in Cloudflare."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 30 --retry 3 --output /dev/null \
            --write-out '%{http_code}' --user "rehearsal:$STAGING_ACCESS_PASSWORD" "$STAGING_URL/readyz")
          if [ "$status" != 200 ]; then
            printf 'Authenticated /readyz expected 200, got %s\n' "$status"
            exit 1
          fi
