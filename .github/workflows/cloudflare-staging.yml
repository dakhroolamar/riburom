name: Cloudflare staging

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - '.github/workflows/cloudflare-staging.yml'
      - '*.py'
      - 'deploy/cloudflare/**'
      - 'static/**'
      - 'templates/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: cloudflare-staging
      url: https://riburom-free-compatibility-probe.dakhroo.workers.dev/
    env:
      WRANGLER_SEND_METRICS: 'false'
      STAGING_URL: https://riburom-free-compatibility-probe.dakhroo.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Assemble Worker and install deployment tools
        env:
          RIBUROM_STAGING_HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: |
          test -n "$RIBUROM_STAGING_HYPERDRIVE_ID"
          python deploy/cloudflare/build.py
          python -m pip install uv==0.13.9
          npm install --prefix deploy/cloudflare/build --no-save --no-audit --no-fund wrangler@4.166.0
          uv sync --directory deploy/cloudflare/build --python "$(cat .python-version)"

      - name: Deploy with the staging Worker token
        working-directory: deploy/cloudflare/build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          uv run --no-sync pywrangler deploy

      - name: Check staging health and the synthetic outbox result
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 5 --retry-delay 4 \
            "$STAGING_URL/healthz" | python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --show-error --max-time 20 --retry 5 --retry-delay 4 \
            "$STAGING_URL/__staging/outbox" | python -c 'import json, sys; result = json.load(sys.stdin); assert (result["status"], result["attempts"], result["postgres_verified"]) == ("SENT", 2, True), result'
