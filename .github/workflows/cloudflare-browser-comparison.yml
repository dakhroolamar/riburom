name: RI BUROM dual-host browser comparison

on:
  push:
    branches: [codex/cloudflare-free-hosting]
    paths:
      - '.github/workflows/cloudflare-browser-comparison.yml'
      - 'tests/cloudflare_parallel_browser_qa.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ contains(github.event.head_commit.message, '[candidate benchmark]') && 'cloudflare-production-candidate' || 'cloudflare-application-staging' }}
    env:
      RIBUROM_BENCHMARK_PROFILE: ${{ contains(github.event.head_commit.message, '[candidate benchmark]') && 'production-candidate' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare read-only pages on desktop and mobile
        env:
          STAGING_ACCESS_PASSWORD: ${{ env.RIBUROM_BENCHMARK_PROFILE == 'production-candidate' && secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN || env.RIBUROM_BENCHMARK_PROFILE == 'staging' && secrets.RIBUROM_STAGING_ACCESS_TOKEN || '' }}
        run: node tests/cloudflare_parallel_browser_qa.cjs
      - name: Measure anonymous and concurrent public responses
        if: ${{ !cancelled() }}
        env:
          STAGING_ACCESS_PASSWORD: ${{ env.RIBUROM_BENCHMARK_PROFILE == 'production-candidate' && secrets.RIBUROM_CANDIDATE_ACCESS_TOKEN || env.RIBUROM_BENCHMARK_PROFILE == 'staging' && secrets.RIBUROM_STAGING_ACCESS_TOKEN || '' }}
        run: python deploy/cloudflare/benchmark_public.py
      - name: Read staging resource counters for the measurement window
        if: ${{ !cancelled() && env.RIBUROM_BENCHMARK_PROFILE == 'staging' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          HYPERDRIVE_ID: ${{ vars.RIBUROM_STAGING_HYPERDRIVE_ID }}
        run: python deploy/cloudflare/staging_usage.py
      - name: Publish screenshots and browser timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riburom-browser-comparison-${{ env.RIBUROM_BENCHMARK_PROFILE }}
          path: ${{ runner.temp }}/riburom-browser-qa
          if-no-files-found: warn
          retention-days: 7
